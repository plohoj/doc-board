<div
  #textContainer
  class="text-container"
>
  @if (status() === 'ACTIVE') {
    <div class="panel">
      <button
        class="icon-button __close"
        matIconButton
        aria-label="Remove annotation"
        matTooltip="Remove annotation"
        (click)="onRemove()"
      >
        <mat-icon>delete_outline</mat-icon>
      </button>

      <button
        class="icon-button"
        matIconButton
        aria-label="Close annotation"
        matTooltip="Close annotation"
        (click)="onClose()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
  <textarea
    #textarea
    placeholder="Add some annotation here..."
    [ngModel]="annotation().comment"
    (ngModelChange)="onCommentChange($event)"
  ></textarea>
</div>

<div
  #pointer
  class="pointer"
>
  <mat-icon [fontIcon]="status() === 'ACTIVE' ? 'open_with' : 'chat'"></mat-icon>
</div>
